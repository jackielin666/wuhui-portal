# 自動檢查 systems.json 裡每個系統的網址能不能打開
# 何時執行：① 修改 systems.json 並推上 GitHub 時 ② 在 Actions 頁面手動按「Run workflow」
# 結果：綠色勾勾 = 全部正常；紅色叉叉 = 有網址打不開（點進去看是哪一個）
name: 檢查系統連結

on:
  push:
    paths:
      - systems.json
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查每個網址
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request

          data = json.load(open("systems.json", encoding="utf-8"))
          failed = 0
          for s in data["systems"]:
              name, url = s.get("name", "?"), s.get("url", "")
              if s.get("visible") is False or not url:
                  print(f"略過  {name}（未顯示或沒有網址）")
                  continue
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 wuhui-portal-link-check"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"正常  {r.status}  {name}  {url}")
              except Exception as e:
                  failed += 1
                  print(f"失敗  {name}  {url}  -> {e}")

          print(f"\n共 {failed} 個網址有問題")
          sys.exit(1 if failed else 0)
          PY
